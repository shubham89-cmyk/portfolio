<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <rect width="400" height="480" fill="#0C0C0C"/>
  <!-- shoulders -->
  <ellipse cx="200" cy="430" rx="150" ry="70" fill="#1F2937"/>
  <ellipse cx="200" cy="420" rx="120" ry="55" fill="#111827"/>
  <!-- neck -->
  <rect x="170" y="280" width="60" height="70" rx="20" fill="#D4A574"/>
  <!-- head -->
  <ellipse cx="200" cy="200" rx="95" ry="110" fill="#E0B080"/>
  <!-- hair -->
  <path d="M110 180 C110 90 150 70 200 70 C250 70 290 90 290 180 C290 140 270 100 200 95 C130 100 110 140 110 180Z" fill="#1A1A1A"/>
  <path d="M160 85 C180 55 220 50 245 80 C230 70 200 65 160 85Z" fill="#0F0F0F"/>
  <!-- ears -->
  <ellipse cx="105" cy="205" rx="16" ry="24" fill="#D4A574"/>
  <ellipse cx="295" cy="205" rx="16" ry="24" fill="#D4A574"/>
  <!-- eyes -->
  <ellipse cx="165" cy="195" rx="18" ry="20" fill="#fff"/>
  <ellipse cx="235" cy="195" rx="18" ry="20" fill="#fff"/>
  <circle cx="167" cy="198" r="9" fill="#3B2314"/>
  <circle cx="237" cy="198" r="9" fill="#3B2314"/>
  <circle cx="170" cy="195" r="3" fill="#fff"/>
  <circle cx="240" cy="195" r="3" fill="#fff"/>
  <!-- brows -->
  <path d="M140 170 Q165 155 190 168" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
  <path d="M210 168 Q235 155 260 170" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M200 205 L192 235 Q200 242 208 235 Z" fill="#C9956A"/>
  <!-- smile -->
  <path d="M165 255 Q200 280 235 255" stroke="#8B4513" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M175 255 Q200 270 225 255" fill="#fff"/>
  <!-- shirt accent -->
  <path d="M80 420 Q200 360 320 420 L320 480 L80 480 Z" fill="#7C3AED"/>
</svg>
